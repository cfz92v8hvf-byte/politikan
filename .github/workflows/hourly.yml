name: Collect European news

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and translate RSS news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TRANSLATOR_URL: ${{ secrets.TRANSLATOR_URL }}
          TRANSLATOR_API_KEY: ${{ secrets.TRANSLATOR_API_KEY }}
        run: python scripts/run.py
      - name: Save editorial queue
        run: |
          git config user.name 'politikan-bot'
          git config user.email 'politikan-bot@users.noreply.github.com'
          git add data/politikan.sqlite3
          git diff --cached --quiet || git commit -m 'chore: update news queue'
          git push
